<section class="bg-[#FAF8F5] px-4 py-12">
    <div class="max-w-7xl mx-auto">

        <!-- Section heading -->
        <div class="text-center mb-8">
            <p class="text-[#C8A165] text-[10px] uppercase tracking-[0.3em] font-semibold mb-2">Collections</p>
            <h2 class="text-2xl md:text-3xl font-semibold text-[#1A1A1A]"
                style="font-family:'Playfair Display',Georgia,serif">Browse by Category</h2>
            <div class="flex items-center justify-center gap-3 mt-3">
                <span class="h-px w-10 bg-[#C8A165] opacity-60"></span>
                <span class="text-[#C8A165] text-sm select-none">✦</span>
                <span class="h-px w-10 bg-[#C8A165] opacity-60"></span>
            </div>
        </div>

        <!-- Category circles: 3 cols mobile → 4 sm → 6 lg -->
        <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-4 md:gap-6">
            {% for category in categories %}
            <a href="{% url 'products-by-category' category.id %}"
               class="group flex flex-col items-center gap-2.5 py-2">
                <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden
                            ring-2 ring-[#E5DDD3] group-hover:ring-[#C8A165]
                            shadow-sm group-hover:shadow-md
                            transition-all duration-300">
                    <img
                        src="{{ category.picture.url }}"
                        alt="{{ category.name }}"
                        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                        loading="lazy"
                    />
                </div>
                <p class="text-xs md:text-sm font-medium text-center text-[#3A3A3A]
                          group-hover:text-[#5A2A83] transition-colors duration-200 leading-tight">
                    {{ category.name }}
                </p>
            </a>
            {% endfor %}
        </div>

    </div>
</section>
