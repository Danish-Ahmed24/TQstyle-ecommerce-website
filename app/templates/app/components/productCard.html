<article data-product-card class="card-luxury rounded-2xl bg-white overflow-hidden hover-lift group flex flex-col h-full relative">

    <!-- Wishlist heart button -->
    <button type="button"
            data-wishlist-id="{{ product.id }}"
            aria-label="{% if product.id in wishlist_product_ids %}Remove from wishlist{% else %}Add to wishlist{% endif %}"
            class="wishlist-btn absolute top-3 right-3 z-10 w-8 h-8 rounded-full
                   bg-white/80 backdrop-blur-sm shadow flex items-center justify-center
                   hover:scale-110 transition-transform duration-150">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 wishlist-icon transition-colors duration-150"
             viewBox="0 0 24 24" stroke-width="2" stroke="#5A2A83"
             fill="{% if product.id in wishlist_product_ids %}#5A2A83{% else %}none{% endif %}">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/>
        </svg>
    </button>

    <!-- Product image -->
    <a href="{% url 'product-detail' product.id %}" class="block img-zoom-wrap flex-shrink-0" tabindex="-1" aria-hidden="true">
        <div class="aspect-square bg-[#F8F5F0]">
            <img
                src="{{ product.variants.first.image.url }}"
                alt="{{ product.name }}"
                class="w-full h-full object-cover"
                loading="lazy"
            />
        </div>
    </a>

    <!-- Info -->
    <div class="p-5 flex flex-col flex-grow">
        <p class="text-[#C8A165] text-[10px] uppercase tracking-widest font-semibold mb-1.5">{{ product.category.name }}</p>

        <a href="{% url 'product-detail' product.id %}">
            <h3 class="font-display text-base font-semibold text-[#1A1A1A] leading-snug line-clamp-2 mb-2 group-hover:text-[#5A2A83] transition-colors duration-200"
                style="font-family:'Playfair Display',Georgia,serif">
                {{ product.name }}
            </h3>
        </a>

        <p class="text-[#C8A165] font-semibold text-xl mt-auto pt-2">Rs.{{ product.variants.first.price }}</p>

        <a href="{% url 'product-detail' product.id %}"
           class="mt-4 w-full flex items-center justify-center gap-1.5 border border-[#5A2A83] text-[#5A2A83] hover:bg-[#5A2A83] hover:text-white rounded-full py-2 text-xs font-semibold tracking-wide transition-all duration-200 min-h-[36px]">
            View Details
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
        </a>
    </div>
</article>
